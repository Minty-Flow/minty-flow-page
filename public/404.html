<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // SPA redirect trick for GitHub Pages.
      // Encodes the path into the query string so the index.html can restore it.
      var l = window.location
      l.replace('/?p=' + encodeURIComponent(l.pathname.slice(1) + l.search) + l.hash)
    </script>
  </head>
</html>
